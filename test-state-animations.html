<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test State-Based Animations</title>
    <style>
        /* Replicate the state-based animation CSS */
        .state-animate {
            display: contents;
            transition-property: transform, opacity, height, max-height, width, max-width;
            transition-timing-function: cubic-bezier(0.87, 0, 0.13, 1);
            transition-duration: 300ms;
        }

        .state-animate-rotate > * {
            transform: rotate(0deg);
            transition: transform 300ms cubic-bezier(0.87, 0, 0.13, 1);
        }

        [data-state="open"] .state-animate-rotate > * {
            transform: rotate(180deg);
        }

        .collapsible-root {
            max-width: 400px;
            margin: 20px auto;
        }

        .collapsible-trigger {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chevron {
            width: 20px;
            height: 20px;
            transition: transform 300ms cubic-bezier(0.87, 0, 0.13, 1);
        }

        [data-state="open"] .chevron {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <h1>Test State-Based Animations</h1>
    
    <div class="collapsible-root" data-state="closed">
        <button class="collapsible-trigger" onclick="toggleCollapsible()">
            Click to expand content
            <div class="state-animate state-animate-rotate">
                <div class="chevron">▼</div>
            </div>
        </button>
    </div>

    <h2>Direct test (should work)</h2>
    <div class="collapsible-root" data-state="closed">
        <button class="collapsible-trigger" onclick="toggleDirect(this)">
            Click to expand content
            <div class="chevron">▼</div>
        </button>
    </div>
    
    <script>
        function toggleCollapsible() {
            const root = document.querySelector('.collapsible-root');
            const isOpen = root.getAttribute('data-state') === 'open';
            root.setAttribute('data-state', isOpen ? 'closed' : 'open');
        }

        function toggleDirect(button) {
            const root = button.closest('.collapsible-root');
            const isOpen = root.getAttribute('data-state') === 'open';
            root.setAttribute('data-state', isOpen ? 'closed' : 'open');
        }
    </script>
</body>
</html>
